name: Build DMF PANEL APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract project
        run: |
          unzip "DMF PANEL APK.zip" -d dmfpanel
          ls -la dmfpanel

      - name: Build APK
        run: |
          cd dmfpanel
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DMF-PANEL-APK
          path: dmfpanel/app/build/outputs/apk/debug/*.apk
